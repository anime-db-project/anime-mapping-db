jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether tagged release already exists
        id: existing_release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists; skipping rebuild and publication."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing_release.outputs.exists != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.existing_release.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore latest successful collection
        id: snapshots
        if: steps.existing_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for candidate in $(gh run list --workflow collect-sources.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.name == "mapping-source-snapshots" and .expired == false) | .id')
            if [[ -n "$artifact" ]]; then
              run_id="$candidate"
              break
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No successful collection yet; release skipped."
            exit 0
          fi
          gh run download "$run_id" --name mapping-source-snapshots --dir snapshots
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Compare collected snapshot fingerprint before building
        id: preflight
        if: steps.snapshots.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed on release lookup errors rather than treating them as changes.
          gh release download --pattern manifest.json --output previous-manifest.json
          python -m anime_mapping_db.snapshots compare \
            --directory snapshots --previous previous-manifest.json \
            >> "$GITHUB_OUTPUT"

      - name: Unit tests
        if: steps.preflight.outputs.build == 'true'
        run: python -m unittest discover -s tests -v

      - name: Seed previous validated dataset when available
        if: steps.preflight.outputs.build == 'true'
        shell: bash
        run: |
          mkdir -p data/mappings
          if [[ -f previous-manifest.json ]]; then
            tag=$(python -c 'import json; print(json.load(open("previous-manifest.json"))["release_tag"])')
            base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
            curl -fsSL "$base/mappings.db.zst" -o previous-runtime.zst
            curl -fsSL "$base/mappings-evidence.db.zst" -o previous-evidence.zst
            python - <<'PYSEED'
          import hashlib
          import json
          from pathlib import Path

          import zstandard as zstd

          manifest = json.loads(Path("previous-manifest.json").read_text())
          assets = manifest["assets"]
          pairs = (
              ("runtime_zstd", Path("previous-runtime.zst"), Path("data/mappings/mappings.db")),
              ("evidence_zstd", Path("previous-evidence.zst"), Path("data/mappings/mappings-evidence.db")),
          )
          for key, source, destination in pairs:
              expected = assets[key]["sha256"]
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"seed checksum mismatch for {source.name}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              with source.open("rb") as src, destination.open("wb") as dst:
                  zstd.ZstdDecompressor().copy_stream(src, dst)
          PYSEED
          else
            echo "No previous mapping release; building the initial release from collected snapshots."
          fi

      - name: Build databases offline
        if: steps.preflight.outputs.build == 'true'
        run: python -m anime_mapping_db build --snapshot-dir snapshots

      - name: Choose release tag
        id: meta
        if: steps.preflight.outputs.build == 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package database assets
        if: steps.preflight.outputs.build == 'true'
        run: >-
          python -m anime_mapping_db package-release
          --tag "${{ steps.meta.outputs.tag }}"
          --output release

      - name: Verify packaged source fingerprint
        if: steps.preflight.outputs.build == 'true'
        run: |
          python -m anime_mapping_db.snapshots verify-release \
            --directory snapshots --release release/manifest.json

      - name: Benchmark released SQLite
        if: steps.preflight.outputs.build == 'true'
        shell: bash
        run: |
          python scripts/benchmark_lookup.py \
            --db release/mappings.db \
            --samples 300 --rounds 2 \
            --output release/performance.json
          (cd release && sha256sum performance.json >> SHA256SUMS)

      - name: Generate release statistics and notes
        if: steps.preflight.outputs.build == 'true'
        run: |
          python -m anime_mapping_db.release_report \
            --manifest release/manifest.json \
            --runtime release/mappings.db \
            --evidence data/mappings/mappings-evidence.db \
            --previous previous-manifest.json \
            --performance release/performance.json \
            --collection snapshots/collection-report.json \
            --output release/statistics.json \
            --notes release-notes.md
          (cd release && sha256sum statistics.json >> SHA256SUMS)
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify release checksums
        if: steps.preflight.outputs.build == 'true'
        run: cd release && sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        if: steps.preflight.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md

      - name: Refresh seven README translations from published release
        if: steps.preflight.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # The run may have started from a tag or before another main commit.
            git fetch origin main
            git switch -C automated-readme-stats origin/main
            python scripts/update_readme_stats.py \
              --manifest release/manifest.json \
              --runtime release/mappings.db \
              --performance release/performance.json
            git add README.md docs/README.*.md
            if git diff --cached --quiet; then
              echo "README statistics already match the published release."
              break
            fi
            git commit -m "docs: refresh stats for ${{ steps.meta.outputs.tag }} [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Unable to update main after three non-force attempts" >&2
              exit 1
            fi
          done

      - name: No source changes
        if: steps.preflight.outputs.build == 'false'
        run: echo "Collected source fingerprint is unchanged; build and release skipped."

      - name: Existing tagged release
        if: steps.existing_release.outputs.exists == 'true'
        run: echo "Release $GITHUB_REF_NAME already exists; tag push is idempotent and no assets were rebuilt."
