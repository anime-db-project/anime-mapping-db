name: Build mapping release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when upstream source fingerprints are unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: anime-mapping-db-release
  cancel-in-progress: false

