name: Build mapping release

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when upstream source fingerprints are unchanged
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "anime_mapping_db/**"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: anime-mapping-db-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether tagged release already exists
        id: existing_release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists; skipping rebuild and publication."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.existing_release.outputs.exists != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.existing_release.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Unit tests
        if: steps.existing_release.outputs.exists != 'true'
        run: python -m unittest discover -s tests -v

      - name: Seed previous validated dataset when available
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        run: |
          mkdir -p data/mappings
          base=https://github.com/anime-db-project/anime-mapping-db/releases/latest/download
          if curl -fsSL "$base/manifest.json" -o previous-manifest.json; then
            curl -fsSL "$base/mappings.db.zst" -o previous-runtime.zst
            curl -fsSL "$base/mappings-evidence.db.zst" -o previous-evidence.zst
            python - <<'PYSEED'
          import hashlib
          import json
          from pathlib import Path

          import zstandard as zstd

          manifest = json.loads(Path("previous-manifest.json").read_text())
          assets = manifest["assets"]
          pairs = (
              ("runtime_zstd", Path("previous-runtime.zst"), Path("data/mappings/mappings.db")),
              ("evidence_zstd", Path("previous-evidence.zst"), Path("data/mappings/mappings-evidence.db")),
          )
          for key, source, destination in pairs:
              expected = assets[key]["sha256"]
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"seed checksum mismatch for {source.name}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              with source.open("rb") as src, destination.open("wb") as dst:
                  zstd.ZstdDecompressor().copy_stream(src, dst)
          PYSEED
          else
            echo "No previous mapping release; building the initial release from upstream sources."
          fi

      - name: Build fresh databases
        if: steps.existing_release.outputs.exists != 'true'
        run: python -m anime_mapping_db build --force

      - name: Choose release tag
        id: meta
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Package assets
        if: steps.existing_release.outputs.exists != 'true'
        run: >-
          python -m anime_mapping_db package-release
          --tag "${{ steps.meta.outputs.tag }}"
          --output release

      - name: Compare with latest published source fingerprint
        id: compare
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          curl -fsSL \
            https://github.com/anime-db-project/anime-mapping-db/releases/latest/download/manifest.json \
            -o previous-manifest.json || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          current = json.loads(Path("release/manifest.json").read_text())
          previous_path = Path("previous-manifest.json")
          previous = json.loads(previous_path.read_text()) if previous_path.is_file() else {}
          explicit_tag = os.environ.get("REF_TYPE") == "tag"
          engine_push = (
              os.environ.get("EVENT_NAME") == "push"
              and os.environ.get("REF_TYPE") == "branch"
          )
          force = os.environ.get("FORCE_RELEASE", "").casefold() == "true"
          changed = current.get("source_fingerprint") != previous.get("source_fingerprint")
          publish = explicit_tag or engine_push or force or changed or not previous
          print(f"publish={'true' if publish else 'false'}")
          print(f"changed={'true' if changed else 'false'}")
          print(f"engine_push={'true' if engine_push else 'false'}")
          PY

      - name: Verify database asset checksums
        if: steps.existing_release.outputs.exists != 'true'
        run: cd release && sha256sum --check SHA256SUMS

      - name: Package source archives
        if: steps.existing_release.outputs.exists != 'true' && steps.compare.outputs.publish == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full zstd
          tag="${{ steps.meta.outputs.tag }}"
          prefix="anime-mapping-db-${tag}"
          zip="release/${prefix}-source.zip"
          zst="release/${prefix}-source.tar.zst"
          seven="release/${prefix}-source.7z"

          git archive --format=zip --prefix="${prefix}/" -o "$zip" "$GITHUB_SHA"
          git archive --format=tar --prefix="${prefix}/" "$GITHUB_SHA" \
            | zstd -T0 -19 -o "$zst"

          stage="$(mktemp -d)"
          git archive --format=tar --prefix="${prefix}/" "$GITHUB_SHA" \
            | tar -xf - -C "$stage"
          7z a -t7z -mx=9 "$seven" "$stage/$prefix" >/dev/null
          rm -rf "$stage"

          {
            sha256sum "$zip" | sed 's#  release/#  #'
            sha256sum "$zst" | sed 's#  release/#  #'
            sha256sum "$seven" | sed 's#  release/#  #'
          } >> release/SHA256SUMS

      - name: Verify complete release checksums
        if: steps.existing_release.outputs.exists != 'true' && steps.compare.outputs.publish == 'true'
        run: cd release && sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        if: steps.existing_release.outputs.exists != 'true' && steps.compare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          mapfile -t base_assets < <(
            find release -maxdepth 1 -type f \
              ! -name '*-source.zip' \
              ! -name '*-source.tar.zst' \
              ! -name '*-source.7z' \
              -print | sort
          )
          gh release create "$tag" "${base_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Automated Anime Mapping DB build with SQLite runtime/provenance assets and portable TSV/JSONL exports. Stable public mapping identities use the amdb:<anchor_id> namespace. See manifest.json for source hashes, schemas and counts."

          # Source archives are intentionally uploaded in a separate final call so
          # they appear after all database/export assets in the release asset list.
          gh release upload "$tag" \
            release/*-source.zip \
            release/*-source.tar.zst \
            release/*-source.7z \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: No source changes
        if: steps.existing_release.outputs.exists != 'true' && steps.compare.outputs.publish != 'true'
        run: echo "Upstream source fingerprint is unchanged; release skipped."

      - name: Existing tagged release
        if: steps.existing_release.outputs.exists == 'true'
        run: echo "Release $GITHUB_REF_NAME already exists; tag push is idempotent and no assets were rebuilt."
