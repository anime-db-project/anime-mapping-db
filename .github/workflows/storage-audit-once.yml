name: One-time SQLite storage audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storage-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest mapping databases
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/anime-db-project/anime-mapping-db/releases/latest/download"
          curl -fsSL "$base/mappings.db.zst" -o mappings.db.zst
          curl -fsSL "$base/mappings-evidence.db.zst" -o mappings-evidence.db.zst
          zstd -d -f mappings.db.zst -o mappings.db
          zstd -d -f mappings-evidence.db.zst -o mappings-evidence.db

      - name: Inspect storage and experiments
        shell: bash
        run: |
          python - <<'PY'
          import os
          import shutil
          import sqlite3
          from pathlib import Path

          def mib(n):
              return n / 1024 / 1024

          def dbstat(path):
              con = sqlite3.connect(path)
              try:
                  rows = con.execute("""
                      SELECT name, SUM(pgsize) AS bytes, SUM(payload) AS payload,
                             COUNT(*) AS pages
                      FROM dbstat
                      GROUP BY name
                      ORDER BY bytes DESC, name
                  """).fetchall()
                  print(f"\n=== DBSTAT {path} file={os.path.getsize(path)} ({mib(os.path.getsize(path)):.2f} MiB) ===")
                  for name, size, payload, pages in rows:
                      print(f"{name}\t{size}\t{mib(size):.3f} MiB\tpayload={payload}\tpages={pages}")
                  return rows
              finally:
                  con.close()

          dbstat("mappings.db")
          dbstat("mappings-evidence.db")

          con = sqlite3.connect("mappings.db")
          print("\n=== RUNTIME COUNTS / DISTRIBUTIONS ===")
          for label, sql in [
              ("nodes", "SELECT COUNT(*) FROM nodes"),
              ("edges", "SELECT COUNT(*) FROM edges"),
              ("edge_status", "SELECT status, COUNT(*) FROM edges GROUP BY status ORDER BY COUNT(*) DESC"),
              ("conflicts", "SELECT COUNT(*) FROM conflicts"),
              ("entities", "SELECT COUNT(*) FROM entities"),
              ("entity_nodes", "SELECT COUNT(*) FROM entity_nodes"),
              ("providers", "SELECT COUNT(DISTINCT provider), AVG(length(provider)), SUM(length(provider)), AVG(length(external_id)), SUM(length(external_id)) FROM nodes"),
              ("numeric_ids", "SELECT SUM(external_id NOT GLOB '*[^0-9]*' AND external_id <> ''), COUNT(*) FROM nodes"),
          ]:
              print(label, con.execute(sql).fetchall())

          sample_node = con.execute("SELECT id FROM nodes ORDER BY id LIMIT 1").fetchone()[0]
          print("\n=== EDGE QUERY PLANS ===")
          queries = [
              ("a_only", "SELECT b_node FROM edges WHERE a_node=?", (sample_node,)),
              ("a_status", "SELECT b_node FROM edges WHERE a_node=? AND status='accepted'", (sample_node,)),
              ("b_status", "SELECT a_node FROM edges WHERE b_node=? AND status='accepted'", (sample_node,)),
          ]
          for label, sql, params in queries:
              print(label, con.execute("EXPLAIN QUERY PLAN " + sql, params).fetchall())
          con.close()

          # Exact raw-file saving from removing the a-side secondary index.
          shutil.copyfile("mappings.db", "runtime-no-a.db")
          con = sqlite3.connect("runtime-no-a.db")
          con.execute("DROP INDEX edges_a_lookup_idx")
          con.execute("VACUUM")
          con.close()
          print("\n=== DROP edges_a_lookup_idx EXPERIMENT ===")
          print("before", os.path.getsize("mappings.db"), "after", os.path.getsize("runtime-no-a.db"), "saved", os.path.getsize("mappings.db")-os.path.getsize("runtime-no-a.db"))

          # Measure provider dictionary representation for nodes in isolation.
          Path("nodes-dict.db").unlink(missing_ok=True)
          src = sqlite3.connect("mappings.db")
          dst = sqlite3.connect("nodes-dict.db")
          dst.executescript("""
              PRAGMA journal_mode=OFF;
              PRAGMA synchronous=OFF;
              CREATE TABLE providers(id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE);
              CREATE TABLE nodes(id INTEGER PRIMARY KEY, provider_id INTEGER NOT NULL, external_id TEXT NOT NULL, UNIQUE(provider_id, external_id));
          """)
          providers = [r[0] for r in src.execute("SELECT DISTINCT provider FROM nodes ORDER BY provider")]
          dst.executemany("INSERT INTO providers(name) VALUES (?)", ((p,) for p in providers))
          pmap = {name: pid for pid, name in dst.execute("SELECT id,name FROM providers")}
          dst.executemany("INSERT INTO nodes(id,provider_id,external_id) VALUES (?,?,?)", ((nid,pmap[p],eid) for nid,p,eid in src.execute("SELECT id,provider,external_id FROM nodes")))
          dst.commit(); dst.execute("VACUUM"); dst.close(); src.close()
          print("\n=== PROVIDER DICTIONARY NODE EXPERIMENT ===")
          dbstat("nodes-dict.db")

          econ = sqlite3.connect("mappings-evidence.db")
          print("\n=== EVIDENCE COUNTS / RECORD-NODE ALTERNATIVE ===")
          print("records", econ.execute("SELECT COUNT(*) FROM records").fetchone()[0])
          print("edge_evidence", econ.execute("SELECT COUNT(*) FROM edge_evidence").fetchone()[0])
          memberships = econ.execute("SELECT COUNT(*) FROM (SELECT record_id,a_node AS node_id FROM edge_evidence UNION SELECT record_id,b_node AS node_id FROM edge_evidence)").fetchone()[0]
          print("unique_record_node_memberships", memberships)
          print("record_key_lengths", econ.execute("SELECT AVG(length(record_key)), SUM(length(record_key)) FROM records").fetchone())
          print("dataset_sha_lengths", econ.execute("SELECT AVG(length(sha256)), SUM(length(sha256)) FROM datasets").fetchone())

          # Materialize exact record_nodes alternative in an isolated scratch DB.
          Path("record-nodes.db").unlink(missing_ok=True)
          rdb = sqlite3.connect("record-nodes.db")
          rdb.execute("CREATE TABLE record_nodes(record_id INTEGER NOT NULL, node_id INTEGER NOT NULL, PRIMARY KEY(record_id,node_id)) WITHOUT ROWID")
          rdb.execute("ATTACH DATABASE 'mappings-evidence.db' AS src")
          rdb.execute("INSERT INTO record_nodes SELECT record_id,a_node FROM src.edge_evidence UNION SELECT record_id,b_node FROM src.edge_evidence")
          rdb.commit(); rdb.execute("VACUUM"); rdb.close()
          dbstat("record-nodes.db")
          PY
