name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q anime_mapping_db tests
      - name: Test
        run: python -m unittest discover -s tests -v

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Portable smoke suite
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: |
          python -m pip install -e .
          python -m pip install ruff coverage
      - name: Lint
        run: ruff check anime_mapping_db tests --select E9,F63,F7,F82
      - name: Format
        run: ruff format --check anime_mapping_db tests
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=70

  malsync-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MALSync/MALSync
          ref: dbab01079ba3752a4c32946deb8c40117dbf0a66
          path: upstream-malsync
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned real upstream fixture
        run: |
          python -m anime_mapping_db.malsync_registry --upstream upstream-malsync --revision dbab01079ba3752a4c32946deb8c40117dbf0a66 --output malsync-audit/inventory.json
          python -c 'import json; d=json.load(open("malsync-audit/inventory.json")); assert d["anime_integrations"]==96; print(d["status_counts"])'
      - uses: actions/upload-artifact@v4
        with:
          name: malsync-inventory-test
          path: malsync-audit/inventory.json

  native-access-audit:
    if: github.head_ref == 'fix/native-malsync-collectors'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Probe public metadata indexes only
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import re
          import time
          from urllib.parse import urlsplit
          from urllib.robotparser import RobotFileParser
          import httpx
          from anime_mapping_db.malsync_web import WEB_SOURCES
          from anime_mapping_db.crawler_policy import user_agent
          candidates = {k: (v[0], v[0] + "/sitemap.xml") for k, v in WEB_SOURCES.items()}
          candidates["tioanime"] = ("https://tioanime.com", "https://tioanime.com/directorio")
          candidates["animeunity"] = ("https://animeunity.cx", "https://animeunity.cx/api/archive?page=1")
          candidates["animeonsen_api"] = ("https://api.animeonsen.xyz", "https://api.animeonsen.xyz/v4/content/index?start=0&limit=30")
          def probe(item):
              name, (origin, target) = item
              result = {"source": name}
              try:
                  with httpx.Client(timeout=12, follow_redirects=False, headers={"User-Agent": user_agent(), "Accept": "*/*"}) as client:
                      robots = client.get(origin + "/robots.txt")
                      result["robots_status"] = robots.status_code
                      if robots.status_code != 200 or "<html" in robots.text.lower():
                          return result
                      lines = robots.text.splitlines()
                      if any(line.lower().startswith("disallow:") and ("*" in line or "$" in line) for line in lines):
                          result["status"] = "complex_robots"
                          return result
                      parser = RobotFileParser()
                      parser.parse(lines)
                      if target.endswith("/sitemap.xml"):
                          declared = [line.split(":", 1)[1].strip() for line in lines if line.lower().startswith("sitemap:")]
                          if declared:
                              target = declared[0]
                      if urlsplit(target).netloc != urlsplit(origin).netloc or not parser.can_fetch(user_agent(), target):
                          result["status"] = "disallowed"
                          return result
                      time.sleep(4)
                      response = client.get(target)
                      result["index_status"] = response.status_code
                      result["content_type"] = response.headers.get("content-type", "")
                      if response.status_code == 200 and "json" in result["content_type"]:
                          payload = response.json()
                          if isinstance(payload, dict):
                              result["keys"] = sorted(payload)
                              for key in ("data", "content", "records"):
                                  rows = payload.get(key)
                                  if isinstance(rows, list) and rows and isinstance(rows[0], dict):
                                      result["record_keys"] = sorted(rows[0])
                                      result["page_records"] = len(rows)
                                      break
                      elif response.status_code == 200:
                          result["xml_index"] = bool(re.search(r"<(?:urlset|sitemapindex)\b", response.text, re.I))
              except Exception as exc:
                  result["error"] = type(exc).__name__
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for row in pool.map(probe, candidates.items()):
                  print(json.dumps(row, sort_keys=True))
          PY
