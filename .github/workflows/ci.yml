name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q anime_mapping_db tests
      - name: Test
        run: python -m unittest discover -s tests -v

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Portable smoke suite
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: |
          python -m pip install -e .
          python -m pip install ruff coverage
      - name: Lint
        run: ruff check anime_mapping_db tests --select E9,F63,F7,F82
      - name: Format
        run: ruff format --check anime_mapping_db tests
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=70
      - name: Source release packaging smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          rm -rf /tmp/amdb-source-smoke
          mkdir -p /tmp/amdb-source-smoke
          python -m anime_mapping_db.source_archives \
            --project anime-mapping-db \
            --tag ci-smoke \
            --commit "$GITHUB_SHA" \
            --output-dir /tmp/amdb-source-smoke \
            --checksums /tmp/amdb-source-smoke/SHA256SUMS
          cd /tmp/amdb-source-smoke
          sha256sum --check SHA256SUMS
