name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q anime_mapping_db tests
      - name: Test
        run: python -m unittest discover -s tests -v

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Portable smoke suite
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: |
          python -m pip install -e .
          python -m pip install ruff coverage
      - name: Lint
        run: ruff check anime_mapping_db tests --select E9,F63,F7,F82
      - name: Format
        run: ruff format --check anime_mapping_db tests
      - name: Coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=70

  malsync-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MALSync/MALSync
          ref: dbab01079ba3752a4c32946deb8c40117dbf0a66
          path: upstream-malsync
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned real upstream fixture
        run: |
          python -m anime_mapping_db.malsync_registry --upstream upstream-malsync --revision dbab01079ba3752a4c32946deb8c40117dbf0a66 --output malsync-audit/inventory.json
          python -c 'import json; d=json.load(open("malsync-audit/inventory.json")); assert d["anime_integrations"]==96; print(d["status_counts"])'
      - uses: actions/upload-artifact@v4
        with:
          name: malsync-inventory-test
          path: malsync-audit/inventory.json

  native-sample-audit:
    if: github.head_ref == 'fix/native-malsync-collectors'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Check public TioAnime title metadata and FireAnime API schema
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.robotparser import RobotFileParser
          import httpx
          from anime_mapping_db.crawler_policy import user_agent
          from anime_mapping_db.tioanime import ORIGIN, DIRECTORY, _Links, _JIKAN
          with httpx.Client(timeout=15, follow_redirects=False, headers={"User-Agent": user_agent()}) as client:
              try:
                  robots = client.get(ORIGIN + "/robots.txt")
                  print("TIO_ROBOTS", robots.status_code)
                  if robots.status_code == 200 and "<html" not in robots.text.lower():
                      lines = robots.text.splitlines()
                      parser = RobotFileParser()
                      parser.parse(lines)
                      complex_rules = any(x.lower().startswith("disallow:") and ("*" in x or "$" in x) for x in lines)
                      if not complex_rules and parser.can_fetch(user_agent(), DIRECTORY):
                          results = []
                          for url in (DIRECTORY, DIRECTORY + "?p=2"):
                              if not parser.can_fetch(user_agent(), url):
                                  break
                              time.sleep(4)
                              response = client.get(url)
                              if response.status_code != 200:
                                  break
                              links = _Links()
                              links.feed(response.text)
                              results.append(links)
                          print("TIO_PAGES", [(len(x.slugs), max(x.pages)) for x in results])
                          if len(results) == 2:
                              print("TIO_OVERLAP", len(results[0].slugs & results[1].slugs))
                              sample = sorted(results[0].slugs)[:3]
                              found = 0
                              for slug in sample:
                                  url = ORIGIN + "/anime/" + slug
                                  if not parser.can_fetch(user_agent(), url):
                                      continue
                                  time.sleep(4)
                                  response = client.get(url)
                                  if response.status_code == 200 and len(set(_JIKAN.findall(response.text))) == 1:
                                      found += 1
                              print("TIO_EXPLICIT_MAL", found, "of", len(sample))
              except Exception as exc:
                  print("TIO_ERROR", type(exc).__name__)
              try:
                  response = client.post("https://fireani.me/api.v1.AnimeService/ListAnimes", json={}, headers={"Accept": "application/json", "Content-Type": "application/json", "Connect-Protocol-Version": "1"})
                  print("FIRE_STATUS", response.status_code)
                  if "json" in response.headers.get("content-type", ""):
                      obj = response.json()
                      if isinstance(obj, dict):
                          print("FIRE_FIELDS", sorted(obj))
                          for key, value in obj.items():
                              if isinstance(value, list) and value and isinstance(value[0], dict):
                                  print("FIRE_RECORD_FIELDS", key, sorted(value[0]))
              except Exception as exc:
                  print("FIRE_ERROR", type(exc).__name__)
          PY
