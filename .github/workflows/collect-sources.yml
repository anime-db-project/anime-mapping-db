name: Collect mapping sources

on:
  workflow_dispatch:
    inputs:
      force_all_sources:
        description: "Ignore collection intervals for this run"
        required: false
        type: boolean
        default: false
      allow_catalogue_shrink:
        description: "Comma-separated importer keys to accept an audited catalogue reduction"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: anime-mapping-db-collection
  cancel-in-progress: false

env:
  MAPPINGS_FIREANIME_SNAPSHOT_URL: ${{ vars.MAPPINGS_FIREANIME_SNAPSHOT_URL }}
  MAPPINGS_FIREANIME_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_FIREANIME_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_FIREANIME: ${{ vars.MAPPINGS_ENABLE_FIREANIME }}
  MAPPINGS_MIRURO_SNAPSHOT_URL: ${{ vars.MAPPINGS_MIRURO_SNAPSHOT_URL }}
  MAPPINGS_MIRURO_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_MIRURO_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_MIRURO: ${{ vars.MAPPINGS_ENABLE_MIRURO }}
  MAPPINGS_GOJO_SNAPSHOT_URL: ${{ vars.MAPPINGS_GOJO_SNAPSHOT_URL }}
  MAPPINGS_GOJO_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_GOJO_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_GOJO: ${{ vars.MAPPINGS_ENABLE_GOJO }}
  MAPPINGS_ANIKOTO_SEASON_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIKOTO_SEASON_SNAPSHOT_URL }}
  MAPPINGS_ANIKOTO_SEASON_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIKOTO_SEASON_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_ANIKOTO_SEASON: ${{ vars.MAPPINGS_ENABLE_ANIKOTO_SEASON }}
  MAPPINGS_ANIMESTREAM_SEASON_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIMESTREAM_SEASON_SNAPSHOT_URL }}
  MAPPINGS_ANIMESTREAM_SEASON_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIMESTREAM_SEASON_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_ANIMESTREAM_SEASON: ${{ vars.MAPPINGS_ENABLE_ANIMESTREAM_SEASON }}
  MAPPINGS_CRUNCHYROLL_SEASON_SNAPSHOT_URL: ${{ vars.MAPPINGS_CRUNCHYROLL_SEASON_SNAPSHOT_URL }}
  MAPPINGS_CRUNCHYROLL_SEASON_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_CRUNCHYROLL_SEASON_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_CRUNCHYROLL_SEASON: ${{ vars.MAPPINGS_ENABLE_CRUNCHYROLL_SEASON }}
  MAPPINGS_NETFLIX_SEASON_SNAPSHOT_URL: ${{ vars.MAPPINGS_NETFLIX_SEASON_SNAPSHOT_URL }}
  MAPPINGS_NETFLIX_SEASON_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_NETFLIX_SEASON_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_NETFLIX_SEASON: ${{ vars.MAPPINGS_ENABLE_NETFLIX_SEASON }}
  MAPPINGS_ANIMEPAHE_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIMEPAHE_SNAPSHOT_URL }}
  MAPPINGS_ANIMEPAHE_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIMEPAHE_PERMISSION_CONFIRMED }}
  MAPPINGS_ANIMEUNITY_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIMEUNITY_SNAPSHOT_URL }}
  MAPPINGS_ANIMEUNITY_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIMEUNITY_PERMISSION_CONFIRMED }}
  MAPPINGS_ANIMEKO_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIMEKO_SNAPSHOT_URL }}
  MAPPINGS_ANIMEKO_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIMEKO_PERMISSION_CONFIRMED }}
  MAPPINGS_ANIMEONSEN_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIMEONSEN_SNAPSHOT_URL }}
  MAPPINGS_ANIMEONSEN_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIMEONSEN_PERMISSION_CONFIRMED }}
  MAPPINGS_ANIMEWHO_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIMEWHO_SNAPSHOT_URL }}
  MAPPINGS_ANIMEWHO_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIMEWHO_PERMISSION_CONFIRMED }}
  MAPPINGS_ANIMEWORLD_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIMEWORLD_SNAPSHOT_URL }}
  MAPPINGS_ANIMEWORLD_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANIMEWORLD_PERMISSION_CONFIRMED }}
  MAPPINGS_HINATASOUL_SNAPSHOT_URL: ${{ vars.MAPPINGS_HINATASOUL_SNAPSHOT_URL }}
  MAPPINGS_HINATASOUL_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_HINATASOUL_PERMISSION_CONFIRMED }}
  MAPPINGS_WITANIME_SNAPSHOT_URL: ${{ vars.MAPPINGS_WITANIME_SNAPSHOT_URL }}
  MAPPINGS_WITANIME_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_WITANIME_PERMISSION_CONFIRMED }}
  MAPPINGS_TIOANIME_SNAPSHOT_URL: ${{ vars.MAPPINGS_TIOANIME_SNAPSHOT_URL }}
  MAPPINGS_TIOANIME_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_TIOANIME_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_ANIMEPAHE: ${{ vars.MAPPINGS_ENABLE_ANIMEPAHE }}
  MAPPINGS_ENABLE_ANIMEUNITY: ${{ vars.MAPPINGS_ENABLE_ANIMEUNITY }}
  MAPPINGS_ENABLE_ANIMEKO: ${{ vars.MAPPINGS_ENABLE_ANIMEKO }}
  MAPPINGS_ENABLE_ANIMEONSEN: ${{ vars.MAPPINGS_ENABLE_ANIMEONSEN }}
  MAPPINGS_ENABLE_ANIMEWHO: ${{ vars.MAPPINGS_ENABLE_ANIMEWHO }}
  MAPPINGS_ENABLE_ANIMEWORLD: ${{ vars.MAPPINGS_ENABLE_ANIMEWORLD }}
  MAPPINGS_ENABLE_HINATASOUL: ${{ vars.MAPPINGS_ENABLE_HINATASOUL }}
  MAPPINGS_ENABLE_WITANIME: ${{ vars.MAPPINGS_ENABLE_WITANIME }}
  MAPPINGS_ENABLE_TIOANIME: ${{ vars.MAPPINGS_ENABLE_TIOANIME }}
  MAPPINGS_ANIME365_INTERVAL_HOURS: ${{ vars.MAPPINGS_ANIME365_INTERVAL_HOURS }}
  MAPPINGS_ANIMELIB_INTERVAL_HOURS: ${{ vars.MAPPINGS_ANIMELIB_INTERVAL_HOURS }}
  MAPPINGS_YUMMYANI_INTERVAL_HOURS: ${{ vars.MAPPINGS_YUMMYANI_INTERVAL_HOURS }}
  MAPPINGS_ANNICT_INTERVAL_HOURS: ${{ vars.MAPPINGS_ANNICT_INTERVAL_HOURS }}
  MAPPINGS_ENABLE_YUMMYANI: ${{ vars.MAPPINGS_ENABLE_YUMMYANI }}
  MAPPINGS_YUMMYANI_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_YUMMYANI_PERMISSION_CONFIRMED }}
  MAPPINGS_ENABLE_ANNICT: ${{ vars.MAPPINGS_ENABLE_ANNICT }}
  MAPPINGS_ANNICT_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_ANNICT_PERMISSION_CONFIRMED }}
  MAPPINGS_ADKAMI_SNAPSHOT_URL: ${{ vars.MAPPINGS_ADKAMI_SNAPSHOT_URL }}
  MAPPINGS_ANIYAN_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIYAN_SNAPSHOT_URL }}
  MAPPINGS_ANIDREAM_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIDREAM_SNAPSHOT_URL }}
  MAPPINGS_ANINEXUS_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANINEXUS_SNAPSHOT_URL }}

jobs:
  kodik-audit:
    name: Audit authorized Kodik material ID scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check credentials and authorization
        id: preflight
        env:
          MAPPINGS_KODIK_API_TOKEN: ${{ secrets.MAPPINGS_KODIK_API_TOKEN }}
          MAPPINGS_KODIK_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_KODIK_PERMISSION_CONFIRMED }}
          MAPPINGS_ENABLE_KODIK: ${{ vars.MAPPINGS_ENABLE_KODIK }}
        shell: bash
        run: |
          enabled="${MAPPINGS_ENABLE_KODIK,,}"
          if [[ "$enabled" =~ ^(0|false|no|off)$ ]]; then
            echo "Kodik disabled" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "${MAPPINGS_KODIK_API_TOKEN//[[:space:]]/}" ]]; then
            echo "Kodik skipped: missing_api_key" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$MAPPINGS_KODIK_PERMISSION_CONFIRMED" != "1" ]]; then
            echo "Kodik skipped: permission_not_confirmed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.preflight.outputs.ready == 'true'
        run: python -m pip install -e .
      - name: Validate bounded sample of material IDs
        if: steps.preflight.outputs.ready == 'true'
        env:
          MAPPINGS_KODIK_API_TOKEN: ${{ secrets.MAPPINGS_KODIK_API_TOKEN }}
          MAPPINGS_KODIK_PERMISSION_CONFIRMED: ${{ vars.MAPPINGS_KODIK_PERMISSION_CONFIRMED }}
        run: python -m anime_mapping_db.kodik_audit --output kodik-audit/report.json
      - uses: actions/upload-artifact@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          name: kodik-material-audit
          path: kodik-audit/report.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  malsync-inventory:
    name: Audit MALSync adapter inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MALSync/MALSync
          ref: master
          path: upstream-malsync
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public adapter definitions without executing upstream code
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git -C upstream-malsync rev-parse HEAD)
          python -m anime_mapping_db.malsync_registry \
            --upstream upstream-malsync --revision "$revision" \
            --output malsync-audit/inventory.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: malsync-inventory
          path: malsync-audit/inventory.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      previous_run: ${{ steps.previous.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Restore previous complete snapshot if available
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for candidate in $(gh run list --workflow collect-sources.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.name == "mapping-source-snapshots" and .expired == false) | .id')
            if [[ -n "$artifact" ]]; then
              run_id="$candidate"
              break
            fi
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --name mapping-source-snapshots --dir snapshots
          fi
      - name: Generate matrix from configured sources
        id: matrix
        env:
          FORCE_ALL: ${{ inputs.force_all_sources }}
        shell: bash
        run: |
          args=(--previous snapshots)
          if [[ "$FORCE_ALL" == "true" ]]; then args+=(--force); fi
          python -m anime_mapping_db.collection matrix "${args[@]}" >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    name: Collect ${{ matrix.name }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.name == 'tioanime authorized title ID export' && 300 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Collect and validate source
        env:
          SOURCE_KEY: ${{ matrix.key }}
          SOURCE_DUE: ${{ matrix.due }}
          MAPPING_CRAWLER_USER_AGENT: ${{ vars.MAPPING_CRAWLER_USER_AGENT }}
          MAPPINGS_YUMMYANI_APPLICATION_TOKEN: ${{ secrets.MAPPINGS_YUMMYANI_APPLICATION_TOKEN }}
          MAPPINGS_ANNICT_ACCESS_TOKEN: ${{ secrets.MAPPINGS_ANNICT_ACCESS_TOKEN }}
        shell: bash
        run: |
          args=()
          if [[ "$SOURCE_DUE" == "false" ]]; then args+=(--defer); fi
          python -m anime_mapping_db.collection collect --source "$SOURCE_KEY" --directory part "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-source-${{ matrix.key }}
          path: part/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 6

  assemble:
    name: Validate and assemble source snapshots
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Restore the same previous snapshot selected by plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ needs.plan.outputs.previous_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_RUN" ]]; then
            gh run download "$PREVIOUS_RUN" --name mapping-source-snapshots --dir snapshots
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: mapping-source-*
          path: parts
          merge-multiple: false
      - name: Merge fresh sources and retain last known good snapshots
        env:
          MAPPINGS_ALLOW_CATALOGUE_SHRINK: ${{ inputs.allow_catalogue_shrink }}
        run: python -m anime_mapping_db.collection assemble --parts parts --directory snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-source-snapshots
          path: snapshots/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 6
