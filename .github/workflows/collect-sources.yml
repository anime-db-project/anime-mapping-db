name: Collect mapping sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: anime-mapping-db-collection
  cancel-in-progress: false

env:
  MAPPINGS_ADKAMI_SNAPSHOT_URL: ${{ vars.MAPPINGS_ADKAMI_SNAPSHOT_URL }}
  MAPPINGS_ANIYAN_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIYAN_SNAPSHOT_URL }}
  MAPPINGS_ANIDREAM_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANIDREAM_SNAPSHOT_URL }}
  MAPPINGS_ANINEXUS_SNAPSHOT_URL: ${{ vars.MAPPINGS_ANINEXUS_SNAPSHOT_URL }}

jobs:
  malsync-inventory:
    name: Audit MALSync adapter inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MALSync/MALSync
          ref: master
          path: upstream-malsync
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public adapter definitions without executing upstream code
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git -C upstream-malsync rev-parse HEAD)
          python -m anime_mapping_db.malsync_registry \
            --upstream upstream-malsync --revision "$revision" \
            --output malsync-audit/inventory.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: malsync-inventory
          path: malsync-audit/inventory.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Generate matrix from configured sources
        id: matrix
        run: python -m anime_mapping_db.collection matrix >> "$GITHUB_OUTPUT"

  collect:
    needs: plan
    name: Collect ${{ matrix.name }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Collect and validate source
        env:
          SOURCE_KEY: ${{ matrix.key }}
          MAPPING_CRAWLER_USER_AGENT: ${{ vars.MAPPING_CRAWLER_USER_AGENT }}
        run: python -m anime_mapping_db.collection collect --source "$SOURCE_KEY" --directory part
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-source-${{ matrix.key }}
          path: part/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 6

  assemble:
    name: Validate and assemble source snapshots
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Restore previous complete snapshot if available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for candidate in $(gh run list --workflow collect-sources.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.name == "mapping-source-snapshots" and .expired == false) | .id')
            if [[ -n "$artifact" ]]; then
              run_id="$candidate"
              break
            fi
          done
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --name mapping-source-snapshots --dir snapshots
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: mapping-source-*
          path: parts
          merge-multiple: false
      - name: Merge fresh sources and retain last known good snapshots
        run: python -m anime_mapping_db.collection assemble --parts parts --directory snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-source-snapshots
          path: snapshots/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 6
