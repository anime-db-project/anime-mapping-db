name: Collect mapping sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: anime-mapping-db-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Restore previous complete snapshot if available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow collect-sources.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --name mapping-source-snapshots --dir snapshots
          fi
      - name: Collect external datasets and API crawlers
        run: python -m anime_mapping_db.snapshots collect --directory snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-source-snapshots
          path: snapshots/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
