name: Collect mapping sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: anime-mapping-db-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Restore previous complete snapshot if available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for candidate in $(gh run list --workflow collect-sources.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.name == "mapping-source-snapshots" and .expired == false) | .id')
            if [[ -n "$artifact" ]]; then
              run_id="$candidate"
              break
            fi
          done
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --name mapping-source-snapshots --dir snapshots
          fi
      - name: Collect external datasets and API crawlers
        env:
          MAPPING_CRAWLER_USER_AGENT: ${{ vars.MAPPING_CRAWLER_USER_AGENT }}
        run: python -m anime_mapping_db.snapshots collect --directory snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: mapping-source-snapshots
          path: snapshots/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
