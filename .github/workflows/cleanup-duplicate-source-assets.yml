name: Cleanup duplicate source release assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-duplicate-source-assets.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove duplicate source bundles and repair release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          note='Automated Anime Mapping DB build with SQLite runtime/provenance assets and portable TSV/JSONL exports. Stable public mapping identities use the amdb:<anchor_id> namespace. GitHub provides the repository Source code (zip) and Source code (tar.gz) archives automatically; this project does not upload duplicate source bundles. See manifest.json for source hashes, schemas and counts.'

          gh api --paginate "/repos/$repo/releases?per_page=100" | jq -c '.[]' | while IFS= read -r release; do
            release_id=$(jq -r '.id' <<<"$release")
            tag=$(jq -r '.tag_name' <<<"$release")
            body=$(jq -r '.body // ""' <<<"$release")
            tmp=$(mktemp -d)
            changed=false

            while IFS=$'\t' read -r asset_id asset_name; do
              case "$asset_name" in
                zz-anime-mapping-db-*-source.zip|zz-anime-mapping-db-*-source.tar.zst|zz-anime-mapping-db-*-source.7z)
                  echo "Deleting $tag/$asset_name"
                  gh api --method DELETE "/repos/$repo/releases/assets/$asset_id"
                  changed=true
                  ;;
              esac
            done < <(jq -r '.assets[]? | [.id, .name] | @tsv' <<<"$release")

            if [[ "$changed" == true ]]; then
              if gh release download "$tag" --repo "$repo" --pattern SHA256SUMS --dir "$tmp" >/dev/null 2>&1; then
                awk '$2 !~ /^zz-anime-mapping-db-.*-source\.(zip|tar\.zst|7z)$/ { print }' \
                  "$tmp/SHA256SUMS" > "$tmp/SHA256SUMS.clean"
                mv "$tmp/SHA256SUMS.clean" "$tmp/SHA256SUMS"
                gh release upload "$tag" "$tmp/SHA256SUMS" --repo "$repo" --clobber >/dev/null
                echo "Repaired $tag/SHA256SUMS"
              fi
            fi

            if [[ "$changed" == true || "$body" == *"Project source is additionally published as checksum-covered"* ]]; then
              gh api --method PATCH "/repos/$repo/releases/$release_id" -f body="$note" >/dev/null
              echo "Repaired notes for $tag"
            fi

            rm -rf "$tmp"
          done

          if gh api --paginate "/repos/$repo/releases?per_page=100" | \
             jq -e '.[] | .assets[]? | select(.name | test("^zz-anime-mapping-db-.*-source\\.(zip|tar\\.zst|7z)$"))' >/dev/null; then
            echo "Duplicate source assets still remain" >&2
            exit 1
          fi

          echo "All duplicate source assets removed."
