[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-mapping-db"
version = "0.3.0"
description = "Build and distribute cross-database anime identifier mappings"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "anime-db-project"}]
dependencies = [
  "httpx==0.28.1",
  "ijson==3.6.0",
  "zstandard==0.25.0",
]

[project.scripts]
anime-mapping-db = "anime_mapping_db.__main__:main"

[tool.setuptools.packages.find]
include = ["anime_mapping_db*"]

[tool.setuptools.package-data]
anime_mapping_db = ["bootstrap/*.json"]
